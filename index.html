<body class="tc-body">
<!--~~ Ordinary tiddlers ~~-->
<script class="tiddlywiki-tiddler-store" type="application/json">
[
    {
        "text": "no",
        "title": "$:/config/AutoSave"
    },
    {
        "title": "$:/config/coreURL",
        "base-path": "https://tiddlywiki.com/prerelease/"
    },
    {
		"title": "$:/config/ExternalJS/EnableExternalPlugins",
        "text": "yes",
    },
    {
        "text": "https://designthinkerer.github.io/in-place-upgrader/tiddlywikicore",
        "title": "$:/config/ExternalJS/Prefix/Core",
    },
    {
        "text": "https://designthinkerer.github.io/in-place-upgrader/myplugins",
        "title": "$:/config/ExternalJS/Prefix/Plugins"
    },
    {
        "text": "yes",
        "title": "$:/config/inplace-upgrade/auto-backup"
    },
    {
        "title": "$:/config/inplace-upgrade/core-url",
        "url": "https://tiddlywiki.com/prerelease/tiddlywikicore-5.5.0-prerelease.js"
    },
    {
        "title": "$:/config/inplace-upgrade/filter",
        "text": "[subfilter{$:/config/SaverFilter}]\n-[prefix[$:/core]!is[shadow]] \n-[prefix[$:/boot/]!is[shadow]]\n-[prefix[$:/themes/tiddlywiki]!is[shadow]] \n-[[$:/config/SaveWikiButton/Template]]"
    },
    {
        "title": "$:/config/inplace-upgrade/target-url",
        "text": "https://tiddlywiki.com/prerelease/empty-external-core.html"
    },
    {
        "text": "show",
        "title": "$:/config/PageControlButtons/Visibility/$:/core/ui/Buttons/home",
    },
    {
        "title": "$:/config/SaveWikiButton/Template",
        "text": "$:/core/save/offline-external-js"
    },
    {
        "title": "$:/DefaultTiddlers",
        "text": "$:/plugins/theophile.dev/inplace-upgrade",
    },
    {
        "tags": "$:/tags/PluginLibrary",
        "url": "https://in-place-upgrader-test.tiddlyhost.com/",
        "caption": "In-Place Upgrader Library",
        "title": "$:/plugins/theophile.dev/inplace-upgrade/library"
    },
    {
        "text": "in-place-upgrader-test.tiddlyhost.com",
        "title": "$:/SiteDomain"
    },
    {
        "text": "https://in-place-upgrader-test.tiddlyhost.com/thumb.png",
        "title": "$:/SitePreviewUrl"
    },
    {
        "title": "$:/SiteSubtitle",
        "text": "Plugin demo"
	},
    {
        "title": "$:/SiteTitle",
        "text": "In-Place Upgrader"
	},
    {
        "text": "https://in-place-upgrader-test.tiddlyhost.com",
        "title": "$:/SiteUrl"
    },
    {
        "title": "$:/status/UserName",
        "text": "theophile.dev"
    },
    {
        "title": "$:/theme",
        "text": "$:/themes/tiddlywiki/vanilla"
    }
]	
</script>
	
<div id="storeArea" style="display:none;"></div>
